[versions]
agp = "9.4.1"
# Must match the Kotlin Gradle plugin AGP ships with (built-in Kotlin).
kotlin = "2.2.10"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
maplibre = "13.6.1"
orgJson = "20260814"
# The CarPlay stack's own dependencies.
hiddenapibypass = "6.1"
bouncycastle = "1.79"
jmdns = "3.6.3"
media3 = "1.11.1"
robolectric = "4.17"
annotation = "1.10.0"
# The Android Auto stack's own dependencies.
androidxMedia = "1.7.0"
protobuf = "3.25.1"
coroutines = "1.10.2"
dexmaker = "2.28.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# The OpenGL ES build: the default artifact requires Vulkan, which older head-unit GPUs lack.
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }
# Android's own org.json is a stub in local unit tests.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
# CarPlay: the hidden TetheringManager API that turns the head unit's hotspot on (HotspotSwitch).
hiddenapibypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenapibypass" }
# CarPlay: pairing and transport cryptography, and Bonjour for wireless CarPlay.
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
# CarPlay: the dashboard-map mirror and audio routing in DiPlay's own screens.
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Android Auto: the media session the phone's playback shows through, and its media-button receiver.
androidx-media = { group = "androidx.media", name = "media", version.ref = "androidxMedia" }
# Android Auto: the protocol's messages.
protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# Android Auto: subclasses the hidden tethering callback that turns the head unit's hotspot on before Android 11.
dexmaker = { group = "com.linkedin.dexmaker", name = "dexmaker", version.ref = "dexmaker" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
