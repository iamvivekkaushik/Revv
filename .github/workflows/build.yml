name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Gradle runs on JDK 25 (gradle/gradle-daemon-jvm.properties); providing it saves a download.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Accepts the SDK licences, so the build can fetch the platform it compiles against.
      - uses: android-actions/setup-android@v4

      # Caches Gradle's downloads and checks the wrapper jar is genuine. The basic cache is the
      # open-source one on GitHub's cache; the default is a commercial service.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build the debug APK and run the unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: revv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
